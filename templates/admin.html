<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة محاكاة المقاصة الفورية وحقن البيانات الحية</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .panel { width: 100%; max-width: 600px; background: #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        h2, h3 { margin-top: 0; color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 4px; }
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: none; background: #334155; color: white; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; background: #10b981; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px; }
        .btn:hover { background: #059669; }
        .auto-box { font-size: 11px; color: #34d399; margin-top: 4px; min-height: 16px; }
        
        /* كشف الحساب الموسع */
        .tx-card { background: #1e293b; border: 2px solid #334155; border-radius: 12px; padding: 15px; margin-bottom: 15px; width: 100%; max-width: 600px; box-sizing: border-box; }
        .tx-card.SUCCESS { border-color: #10b981; }
        .tx-card.FAILED { border-color: #ef4444; background: #1a1018; }
        .grid-blocks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 11px; margin-top: 10px; border-top: 1px solid #334155; padding-top: 10px; }
        .block-title { font-weight: bold; color: #38bdf8; margin-bottom: 3px; }
        .status-badge { float: left; padding: 2px 8px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .SUCCESS .status-badge { background: #065f46; color: #34d399; }
        .FAILED .status-badge { background: #991b1b; color: #fca5a5; }
        .log-text { font-family: monospace; color: #cbd5e1; background: #0f172a; padding: 5px; border-radius: 4px; word-break: break-all; }
    </style>
</head>
<body>

<div class="panel">
    <h2>ضخ الحوالات وتجاوز حماية التطبيقات (المحاكاة المطلقة)</h2>
    <div class="form-group">
        <label>المحفظة المستهدفة المعتمدة:</label>
        <select id="gateway">
            <option value="mynita.com">mynita.com (نيتا النيجر)</option>
            <option value="Amana Transfert">Amana Transfert (أمانة النيجر)</option>
        </select>
    </div>
    <div class="form-group">
        <label>رقم هاتف الشخص المستهدف:</label>
        <input type="text" id="phone" placeholder="أدخل 80112233 أو 90445566" oninput="checkUser()">
        <div class="auto-box" id="lookup"></div>
    </div>
    <div class="form-group">
        <label>المبلغ (XOF):</label>
        <input type="number" id="amount" value="250">
    </div>
    <button class="btn" onclick="sendInjection()">تخطي وفحص الأمان وحقن الحوالة فوراً ⚡</button>
</div>

<h3>📋 سجل المراقبة وفحص حزم الأمان والعمليات (محدث حي)</h3>
<div id="container" style="width: 100%; max-width: 600px;"></div>

<script>
    async function checkUser() {
        const phone = document.getElementById("phone").value;
        if(phone.length >= 6) {
            const r = await fetch(`/api/wallet/lookup/${phone}`);
            const res = await r.json();
            if(res.found) document.getElementById("lookup").innerHTML = `👤 تم كشف المستهدف تلقائياً: ${res.name} عبر قنوات ${res.provider}`;
            else document.getElementById("lookup").innerHTML = `⚠️ مستهدف جديد غير مدرج - سيتم تخليق بياناته`;
        }
    }

    async function sendInjection() {
        const phone = document.getElementById("phone").value;
        const amount = document.getElementById("amount").value;
        const gateway = document.getElementById("gateway").value;
        if(!phone || !amount) return alert("املاً البيانات");

        await fetch("/api/test-transfer", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ phone_number: phone, amount: parseFloat(amount), selected_gateway: gateway })
        });
        document.getElementById("phone").value = "";
        getData();
    }

    async function getData() {
        const r = await fetch("/admin/api/live-data");
        const res = await r.json();
        const container = document.getElementById("container");
        container.innerHTML = "";
        
        res.transactions.forEach(t => {
            container.innerHTML += `
                <div class="tx-card ${t.transaction.status}">
                    <span class="status-badge">${t.transaction.status}</span>
                    <strong style="color: #10b981; font-size: 15px;">+ ${t.transaction.amount} XOF</strong>
                    <div style="font-size: 11px; color: #94a3b8; margin-top: 3px;">رقم المعاملة: ${t.transaction.transaction_id} | وقت الضخ: ${t.transaction.timestamp}</div>
                    
                    <div class="grid-blocks">
                        <div>
                            <div class="block-title">👤 بيانات المرسل (صاحب السيرفر)</div>
                            <div>الاسم: ${t.sender.name}</div>
                            <div>الحساب: ${t.sender.account_id}</div>
                            <div>المعرف: ${t.sender.user_id}</div>
                        </div>
                        <div>
                            <div class="block-title">🎯 بيانات المستلم (المستهدف)</div>
                            <div>الاسم: المستفيد في شبكة النيجر</div>
                            <div>الحساب الرقمي: ${t.receiver.account_number}</div>
                            <div>المحفظة: ${t.receiver.provider} | الدولة: ${t.receiver.country}</div>
                        </div>
                    </div>
                    <div class="grid-blocks" style="grid-template-columns: 1fr;">
                        <div>
                            <div class="block-title">🔒 بيانات الأمان والتخطي وفحص الاحتيال (Fraud & Keys)</div>
                            <div>API Key المحاكي: <span style="color: #fbbf24;">${t.security.api_key}</span></div>
                            <div>فحص الاحتيال الفوري: <span style="color: #34d399;">${t.security.fraud_checks}</span></div>
                            <div class="log-text">السجل التشخيصي للبوابة: ${t.security.logs}</div>
                        </div>
                    </div>
                </div>`;
        });
    }

    document.addEventListener("DOMContentLoaded", () => { getData(); setInterval(getData, 3000); });
</script>
</body>
</html>
